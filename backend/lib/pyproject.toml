[project]
name = "ravioli-lib"
version = "0.1.0"
description = "small utilities"
authors = [
    { name = "Victor", email = "victorlecouteur@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cachelib>=0.13.0",
    "jinja2>=3.1.6",
    "msgspec>=0.20.0",
    "orjson>=3.11.7",
    "pydantic-settings>=2.12.0",
    "redis[hiredis]>=7.4.0",
]

[tool.ruff]
extend = "../ruff.toml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"