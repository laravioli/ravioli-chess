[project]
name = "ravioli-lib"
version = "0.1.0"
description = "small utilities"
authors = [
    { name = "Victor", email = "victorlecouteur@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cachelib>=0.13.0",
    "jinja2>=3.1.6",
    "msgspec>=0.20.0",
    "orjson>=3.11.7",
    "pydantic-settings>=2.12.0",
    "redis[hiredis]>=7.4.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
extend = "../../ruff.toml"
