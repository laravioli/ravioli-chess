services:
  client:
    build:
      context: ../client
      dockerfile: ../docker/client/Dockerfile
      target: client-dev
    volumes:
      - ../client/src/:/usr/local/app/src/
    ports:
      - 127.0.0.1:5173:5173
    env_file:
      - client/.env
  backend:
    build:
      context: ../server
      dockerfile: ../docker/backend/Dockerfile
      target: backend-dev
    volumes:
      - ../server/raviolichess/:/usr/local/app/raviolichess/
    ports:
      - 127.0.0.1:8000:8000
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16.9
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - backend/.env.db
    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 4s
      timeout: 2s
      retries: 5
  redis:
    image: redis:7
    expose:
      - 6379
      
volumes:
  postgres_data:
